<app-page-header
  title="Guia de estilo"
  subtitle="Revision visual del sistema de diseno. Alterna el tema para verificar ambos modos."
>
  <button mat-stroked-button type="button" (click)="toggleTheme()">
    <mat-icon aria-hidden="true">{{ isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
    {{ isDark() ? 'Ver tema claro' : 'Ver tema oscuro' }}
  </button>
</app-page-header>

<app-guide-foundation
  [surfaceTokens]="surfaceTokens"
  [accentTokens]="accentTokens"
  [typography]="typography"
  [decimalSample]="decimalSample"
/>

<app-guide-space-motion [rhythmTokens]="rhythmTokens" [spaceScale]="spaceScale" />

<app-guide-patterns
  [tones]="tones"
  [toneLabels]="toneLabels"
  [guideRows]="guideRows"
  [guideColumns]="guideColumns"
  [zIndexScale]="zIndexScale"
/>
