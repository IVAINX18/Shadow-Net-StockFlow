# Integracion continua de Shadow-Net StockFlow.
#
# Verifica estilo y pruebas del backend y que el frontend compile con tipado
# estricto. La etapa de despliegue se anadira en una fase posterior
# (ver docs/architecture/deployment-architecture.md, seccion 5).

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Pint + Pest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, bcmath, intl, zip
          tools: composer:v2

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar entorno de pruebas
        # El archivo .env.example se copia y se genera una clave efimera solo
        # para la CI; no contiene secretos reales.
        run: cp .env.example .env && php artisan key:generate

      - name: Verificar estilo (Pint)
        run: ./vendor/bin/pint --test

      - name: Ejecutar pruebas (Pest)
        # Las pruebas de esta fase no requieren MySQL; cuando existan pruebas
        # de integracion se agregara el servicio mysql:8.4 al flujo (Fase 3).
        run: php artisan test

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar (tipado estricto)
        run: npm run build
