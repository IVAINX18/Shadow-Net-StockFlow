# Integracion continua de Shadow-Net StockFlow.
#
# Verifica estilo y pruebas del backend y que el frontend compile con tipado
# estricto. La etapa de despliegue se anadira en una fase posterior
# (ver docs/architecture/deployment-architecture.md, seccion 5).

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Pint + Pest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Uso MySQL real en la CI porque la decisión del proyecto prohíbe
      # SQLite en las pruebas de integración: el esquema debe validarse
      # contra el mismo motor de producción.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: stockflow_test
          MYSQL_USER: stockflow
          MYSQL_PASSWORD: stockflow_ci
          MYSQL_ROOT_PASSWORD: stockflow_root_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pstockflow_root_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: stockflow_test
      DB_USERNAME: stockflow
      DB_PASSWORD: stockflow_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, bcmath, intl, zip
          tools: composer:v2

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar entorno de pruebas
        # El archivo .env.example se copia y se genera una clave efimera solo
        # para la CI; no contiene secretos reales.
        run: cp .env.example .env && php artisan key:generate

      - name: Verificar estilo (Pint)
        run: ./vendor/bin/pint --test

      - name: Ejecutar pruebas (Pest)
        # La suite corre contra el servicio mysql:8.4 declarado arriba.
        run: php artisan test

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar (tipado estricto)
        run: npm run build
